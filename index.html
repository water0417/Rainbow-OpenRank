<style>
:root {
--bg-primary: linear-gradient(135deg, #ffffff 0%, #f8fafc 30%, #e0f2fe 60%, #fbcfe8 100%);
--bg-secondary: rgba(255, 255, 255, 0.8);
--bg-tertiary: rgba(248, 250, 252, 0.9);
--text-primary: #333333;
--text-secondary: #64748b;
--border-color: rgba(100, 149, 237, 0.2);
--grid-color: rgba(100, 149, 237, 0.05);
--accent-color: #6366f1;
--accent-hover: #8b5cf6;
--btn-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
--modal-bg: rgba(255, 255, 255, 0.95);
--tooltip-bg: rgba(20, 20, 30, 0.9);
}
.dark-theme {
--bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
--bg-secondary: rgba(15, 15, 25, 0.7);
--bg-tertiary: rgba(30, 30, 40, 0.8);
--text-primary: #ffffff;
--text-secondary: #a0a0a0;
--border-color: rgba(100, 200, 255, 0.2);
--grid-color: rgba(50, 100, 200, 0.1);
--accent-color: #667eea;
--accent-hover: #764ba2;
--btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
--modal-bg: rgba(20, 20, 30, 0.95);
--tooltip-bg: rgba(20, 20, 30, 0.9);
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: var(--bg-primary);
color: var(--text-primary);
overflow: hidden;
transition: all 0.3s ease;
}
body::before {
content: '';
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-image:
linear-gradient(var(--grid-color) 1px, transparent 1px),
linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
background-size: 50px 50px;
z-index: -1;
transition: all 0.3s ease;
}
.header {
height: 70px;
background: var(--bg-secondary);
backdrop-filter: blur(10px);
border-bottom: 1px solid var(--border-color);
display: flex;
align-items: center;
padding: 0 20px;
justify-content: space-between;
box-shadow: 0 2px 20px rgba(100, 149, 237, 0.1);
transition: all 0.3s ease;
}
.title {
font-size: 24px;
font-weight: 700;
background: linear-gradient(135deg, #1e3a8a 0%, #6366f1 50%, #8b5cf6 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}
.control-panel {
display: flex;
gap: 15px;
align-items: center;
}
.repo-select {
position: relative;
z-index: 999;
}
.select-input {
width: 300px;
padding: 10px 15px;
background: var(--bg-secondary);
border: 1px solid var(--border-color);
border-radius: 8px;
color: var(--text-primary);
font-size: 14px;
cursor: pointer;
transition: all 0.3s ease;
z-index: 999;
}
.select-input:focus {
outline: none;
border-color: #6366f1;
box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
z-index: 999;
}
.select-dropdown {
position: absolute;
top: 100%;
left: 0;
width: 100%;
max-height: 300px;
overflow-y: auto;
background: var(--bg-tertiary);
border: 1px solid var(--border-color);
border-radius: 8px;
margin-top: 5px;
z-index: 9999;
backdrop-filter: blur(10px);
display: none;
box-shadow: 0 10px 30px rgba(100, 149, 237, 0.2);
z-index: 999;
}
.select-dropdown.show {
display: block;
z-index: 999;
}
.dropdown-item {
padding: 10px 15px;
cursor: pointer;
transition: all 0.2s ease;
border-bottom: 1px solid var(--border-color);
color: var(--text-primary);
}
.dropdown-item:hover {
background: rgba(99, 102, 241, 0.1);
color: var(--accent-color);
}
.dropdown-item:last-child {
border-bottom: none;
}
.github-link {
color: var(--accent-color);
text-decoration: none;
transition: all 0.3s ease;
word-break: break-all;
}
.github-link:hover {
color: #4a89dc;
text-decoration: underline;
}
.main-container {
display: flex;
height: calc(100vh - 70px);
}
.sidebar {
width: 300px;
background: var(--bg-secondary);
backdrop-filter: blur(10px);
border-right: 1px solid var(--border-color);
padding: 20px;
overflow-y: auto;
color: var(--text-primary);
}
.graph-container {
flex: 1;
position: relative;
overflow: hidden;
margin-left: -20px;
margin-right: -20px;
}
#graph {
width: 105%;
height: 105%;
margin-left: -2.5%;
margin-top: -2.5%;
}
.node {
cursor: pointer;
transition: all 0.3s ease;
}
@keyframes pulse {
0% {
box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
}
70% {
box-shadow: 0 0 0 20px rgba(102, 126, 234, 0);
}
100% {
box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
}
}
.glow-text {
text-shadow: 0 0 10px rgba(102, 126, 234, 0.8),
0 0 20px rgba(102, 126, 234, 0.5);
}
.btn:hover {
transform: translateY(-3px);
box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4),
0 0 40px rgba(102, 126, 234, 0.2);
}
.modal.show {
opacity: 1;
visibility: visible;
}
.modal-content {
transform: scale(0.95);
transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal.show .modal-content {
transform: scale(1);
}
.modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.5);
backdrop-filter: blur(5px);
display: flex;
justify-content: center;
align-items: center;
z-index: 2000;
opacity: 0;
visibility: hidden;
transition: all 0.3s ease;
}
.modal.show {
opacity: 1;
visibility: visible;
}
.modal-content {
background: var(--modal-bg);
backdrop-filter: blur(15px);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 25px;
width: 90%;
max-width: 800px;
max-height: 80vh;
overflow-y: auto;
box-shadow: 0 10px 50px rgba(100, 149, 237, 0.2);
position: relative;
color: var(--text-primary);
}
.close-btn {
position: absolute;
top: 15px;
right: 20px;
background: none;
border: none;
color: var(--text-primary);
font-size: 24px;
cursor: pointer;
transition: color 0.3s ease;
}
.close-btn:hover {
color: #ff4757;
}
.repo-detail {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
}
.detail-section {
background: var(--bg-tertiary);
border-radius: 8px;
padding: 15px;
border: 1px solid var(--border-color);
}
.section-title {
font-size: 16px;
font-weight: 600;
color: var(--accent-color);
margin-bottom: 10px;
border-bottom: 1px solid var(--border-color);
padding-bottom: 5px;
}
.detail-item {
margin-bottom: 8px;
font-size: 14px;
}
.label {
color: var(--text-secondary);
margin-right: 5px;
}
.value {
color: var(--text-primary);
font-weight: 500;
}
.chart-container {
height: 400px;
margin-top: 10px;
width: 100%;
background: var(--bg-secondary);
border-radius: 8px;
padding: 10px;
}
#radarChart {
height: 500px;
}
.btn {
padding: 10px 20px;
background: var(--btn-gradient);
border: none;
border-radius: 8px;
color: #ffffff;
font-size: 14px;
cursor: pointer;
transition: all 0.3s ease;
box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
}
.btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}
::-webkit-scrollbar {
width: 8px;
}
::-webkit-scrollbar-track {
background: rgba(20, 20, 30, 0.5);
}
::-webkit-scrollbar-thumb {
background: rgba(102, 126, 234, 0.5);
border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
background: rgba(102, 126, 234, 0.7);
}
.loading {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
text-align: center;
}
.spinner {
width: 50px;
height: 50px;
border: 3px solid rgba(102, 126, 234, 0.3);
border-top: 3px solid #667eea;
border-radius: 50%;
animation: spin 1s linear infinite;
margin: 0 auto 15px;
}
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
@media (max-width: 1024px) {
.sidebar {
width: 250px;
}
.repo-detail {
grid-template-columns: 1fr;
}
}
@media (max-width: 768px) {
.sidebar {
display: none;
}
.select-input {
width: 200px;
}
}
.theme-toggle {
background: var(--bg-secondary);
border: 1px solid var(--border-color);
color: var(--accent-color);
font-size: 22px;
cursor: pointer;
padding: 12px;
border-radius: 50%;
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
}
.theme-toggle:hover {
transform: rotate(15deg) scale(1.1);
background: var(--btn-gradient);
color: white;
border-color: var(--accent-color);
box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}
</style>
</head>
<body>
<div class="header">
<div style="display: flex; align-items: center; gap: 20px;">
<img src="./RainbowSpy.png" alt="RaibowSpy Logo" class="header-logo" height="50">

<input type="text" class="select-input" placeholder="搜索或选择仓库..." id="repoInput">

</a>

<script>
let allRepos = [];
let priorityData = [];
let similarityData = [];
let topRepos = []; 
let currentRepo = null;
let myChart = null;
let repoCount = 20; 
async function init() {
await loadData();
initDropdown();
initGraph();
if (allRepos.length > 0) {
selectRepo(allRepos[0].basic_info.full_name);
}
}
async function loadData() {
try {
const allResponse = await fetch('all.json');
const allData = await allResponse.json();
allRepos = allData.repos_data;
const priorityResponse = await fetch('priority.csv');
const priorityText = await priorityResponse.text();
priorityData = parseCSV(priorityText);
const similarityResponse = await fetch('similarity.csv');
const similarityText = await similarityResponse.text();
similarityData = parseSimilarityCSV(similarityText);
const topReposResponse = await fetch('top_10_potential_repos.json');
const topReposData = await topReposResponse.json();
topRepos = topReposData.top_10_repos;
document.getElementById('loading').style.display = 'none';
} catch (error) {
console.error('加载数据失败:', error);
alert('加载数据失败，请检查文件路径');
}
}
function parseCSV(csvText) {
csvText = csvText.trim().replace(/^\ufeff/, '');
const result = [];
let currentLine = '';
let inQuotes = false;
for (let i = 0; i < csvText.length; i++) {
const char = csvText[i];
const nextChar = csvText[i + 1];
if (char === '"') {
if (nextChar === '"') {
currentLine += '"';
i++;
} else {
inQuotes = !inQuotes;
}
} else if (char === '\n' && !inQuotes) {
result.push(currentLine.trim());
currentLine = '';
} else {
currentLine += char;
}
}
if (currentLine.trim()) {
result.push(currentLine.trim());
}
if (result.length === 0) {
return [];
}
const headers = [];
let currentValue = '';
let titleInQuotes = false;
for (let i = 0; i < result[0].length; i++) {
const char = result[0][i];
const nextChar = result[0][i + 1];
if (char === '"') {
if (nextChar === '"') {
currentValue += '"';
i++;
} else {
titleInQuotes = !titleInQuotes;
}
} else if (char === ',' && !titleInQuotes) {
headers.push(currentValue.trim());
currentValue = '';
} else {
currentValue += char;
}
}
headers.push(currentValue.trim());
console.log('CSV Headers:', headers);
if (!headers.includes('final_priority_score')) {
console.warn('final_priority_score field not found in CSV headers');
console.log('Available headers:', headers);
}
return result.slice(1).map((line, lineIndex) => {
if (!line.trim()) return {};
const values = [];
let currentValue = '';
let inQuotes = false;
for (let i = 0; i < line.length; i++) {
const char = line[i];
const nextChar = line[i + 1];
if (char === '"') {
if (nextChar === '"') {
currentValue += '"';
i++;
} else {
inQuotes = !inQuotes;
}
} else if (char === ',' && !inQuotes) {
values.push(currentValue.trim());
currentValue = '';
} else {
currentValue += char;
}
}
values.push(currentValue.trim());
const obj = {};
headers.forEach((header, index) => {
obj[header] = values[index] || '';
});
if (lineIndex < 5) {
console.log(`CSV Line ${lineIndex + 1}:`, obj);
console.log(`Final Priority Score for line ${lineIndex + 1}:`, obj.final_priority_score);
}
return obj;
}).filter(obj => Object.keys(obj).length > 0);
}
function parseCSVLine(line) {
const result = [];
let current = '';
let inQuotes = false;
for (let i = 0; i < line.length; i++) {
const char = line[i];
if (char === '"') {
inQuotes = !inQuotes;
} else if (char === ',' && !inQuotes) {
result.push(current.trim());
current = '';
} else {
current += char;
}
}
result.push(current.trim());
return result;
}
function parseSimilarityCSV(csvText) {
const lines = csvText.split('\n');
const repos = lines[0].split(',');
const data = [];
for (let i = 1; i < lines.length; i++) {
const values = lines[i].split(',');
const repoName = values[0];
const similarities = {};
for (let j = 1; j < values.length; j++) {
similarities[repos[j]] = parseFloat(values[j]);
}
data.push({ repoName, similarities });
}
return data;
}
function initDropdown() {
const input = document.getElementById('repoInput');
const dropdown = document.getElementById('repoDropdown');
input.addEventListener('input', () => {
const value = input.value.toLowerCase();
if (value.trim() === '') {
dropdown.innerHTML = '';
dropdown.classList.remove('show');
return;
}
const filtered = allRepos.filter(repo =>
repo.basic_info.full_name.toLowerCase().includes(value)
);
dropdown.innerHTML = '';
filtered.slice(0, 20).forEach(repo => { 
const item = document.createElement('div');
item.className = 'dropdown-item';
item.textContent = repo.basic_info.full_name;
item.addEventListener('click', (e) => {
e.preventDefault();
e.stopPropagation();
selectRepo(repo.basic_info.full_name);
input.value = repo.basic_info.full_name;
dropdown.classList.remove('show');
});
dropdown.appendChild(item);
});
dropdown.classList.add('show');
});
input.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
const value = input.value.trim();
if (value) {
const repo = allRepos.find(r => r.basic_info.full_name.toLowerCase() === value.toLowerCase());
if (repo) {
selectRepo(repo.basic_info.full_name);
dropdown.classList.remove('show');
} else {
const filtered = allRepos.filter(repo =>
repo.basic_info.full_name.toLowerCase().includes(value.toLowerCase())
);
if (filtered.length > 0) {
selectRepo(filtered[0].basic_info.full_name);
input.value = filtered[0].basic_info.full_name;
dropdown.classList.remove('show');
}
}
}
}
});
document.addEventListener('click', (e) => {
if (!input.contains(e.target) && !dropdown.contains(e.target)) {
dropdown.classList.remove('show');
}
});
}
function selectRepo(fullName) {
currentRepo = allRepos.find(repo => repo.basic_info.full_name === fullName);
if (!currentRepo) return;
updateSidebarInfo();
generateGraph();
}
function updateSidebarInfo() {
const priority = priorityData.find(item => item.repo_name === currentRepo.basic_info.full_name);
document.getElementById('currentRepoName').textContent = currentRepo.basic_info.full_name;
document.getElementById('currentRepoLang').textContent = currentRepo.basic_info.language || '未知';
document.getElementById('currentRepoStars').textContent = currentRepo.metrics.star_count.toLocaleString();
document.getElementById('currentRepoPriority').textContent = priority ? priority.final_priority_score : '未知';
}
function initGraph() {
const chartDom = document.getElementById('graph');
myChart = echarts.init(chartDom);
window.addEventListener('resize', () => {
myChart.resize();
});
}
function generateGraph() {
if (!currentRepo || !myChart) return;
const similarity = similarityData.find(item => item.repoName === currentRepo.basic_info.full_name);
if (!similarity) return;
const similarRepos = Object.entries(similarity.similarities)
.filter(([repoName, score]) => repoName !== currentRepo.basic_info.full_name)
.sort((a, b) => b[1] - a[1])
.slice(0, repoCount);
const nodes = [
{
id: currentRepo.basic_info.full_name,
name: currentRepo.basic_info.repo_name,
value: getPriority(currentRepo.basic_info.full_name),
symbolSize: 70,
itemStyle: {
color: getLanguageColor(currentRepo.basic_info.language),
shadowBlur: 30,
shadowColor: getLanguageColor(currentRepo.basic_info.language),
shadowOffsetX: 0,
shadowOffsetY: 0,
borderColor: '#ffffff',
borderWidth: 2
},
label: {
show: true,
color: '#fff',
fontWeight: 'bold',
fontSize: 14,
offset: [0, -10]
},
category: 0,
draggable: true
}
];
similarRepos.forEach(([repoName, score]) => {
const repo = allRepos.find(r => r.basic_info.full_name === repoName);
if (repo) {
const nodeColor = getLanguageColor(repo.basic_info.language);
nodes.push({
id: repoName,
name: repo.basic_info.repo_name,
value: getPriority(repoName),
symbolSize: 25 + score * 60,
itemStyle: {
color: nodeColor,
shadowBlur: 15,
shadowColor: nodeColor,
shadowOffsetX: 0,
shadowOffsetY: 0,
opacity: 0.7 + score * 0.3,
borderColor: '#ffffff',
borderWidth: 1
},
label: {
show: score > 0.45,
color: '#fff',
fontSize: 12,
offset: [0, 5],
formatter: function(params) {
return params.name.length > 15 ? params.name.substring(0, 15) + '...' : params.name;
}
},
category: 1,
draggable: true,
similarityScore: score
});
}
});
const links = similarRepos.map(([repoName, score]) => {
const targetRepo = allRepos.find(r => r.basic_info.full_name === repoName);
return {
source: currentRepo.basic_info.full_name,
target: repoName,
value: score,
lineStyle: {
width: score * 6,
color: {
type: 'linear',
x: 0,
y: 0,
x2: 1,
y2: 1,
colorStops: [{
offset: 0, color: getLanguageColor(currentRepo.basic_info.language)
}, {
offset: 1, color: getLanguageColor(targetRepo?.basic_info.language)
}]
},
opacity: 0.7,
curveness: 0.2
},
emphasis: {
lineStyle: {
width: score * 8,
opacity: 0.9
}
}
};
});
const option = {
backgroundColor: 'transparent',
tooltip: {
trigger: 'item',
backgroundColor: 'rgba(20, 20, 30, 0.95)',
borderColor: 'rgba(100, 200, 255, 0.3)',
borderWidth: 1,
textStyle: {
color: '#ffffff'
},
transitionDuration: 0.3,
formatter: function(params) {

function generateLanguageLegend() {
const legendContainer = document.getElementById('languageLegend');
const colorMap = {
'JavaScript': '#ffd3b6',
'Python': '#ffaaa5',
'Java': '#ff8c94',
'TypeScript': '#a8e6cf',
'Go': '#dcedc1',
'C++': '#c7d5e8',
'C': '#ff9a76',
'C#': '#84a59d',
'Ruby': '#f7b801',
'PHP': '#f6bd60',
'Swift': '#f5cac3',
'Kotlin': '#f28482',
'Rust': '#81b29a',
'Dart': '#f8edeb',
'Shell': '#9a8c98',
'HTML': '#c9ada7',
'CSS': '#d8e2dc',
'Markdown': '#a8bedf',
'JSON': '#f0efeb'
};
legendContainer.innerHTML = '';
Object.entries(colorMap).forEach(([language, color]) => {
const legendItem = document.createElement('div');
legendItem.style.display = 'flex';
legendItem.style.alignItems = 'center';
legendItem.style.marginBottom = '8px';
legendItem.style.fontSize = '12px';
const colorBox = document.createElement('div');
colorBox.style.width = '15px';
colorBox.style.height = '15px';
colorBox.style.backgroundColor = color;
colorBox.style.borderRadius = '3px';
colorBox.style.marginRight = '8px';
colorBox.style.border = '1px solid rgba(255, 255, 255, 0.3)';
const languageName = document.createElement('span');
languageName.textContent = language;
const isDarkTheme = document.body.classList.contains('dark-theme');
languageName.style.color = isDarkTheme ? '#ffffff' : '#333333';
legendItem.appendChild(colorBox);
legendItem.appendChild(languageName);
legendContainer.appendChild(legendItem);
});
}
function initEventListeners() {
document.getElementById('refreshBtn').addEventListener('click', () => {
init();
});
document.getElementById('themeToggle').addEventListener('click', () => {
toggleTheme();
});
document.getElementById('closeModal').addEventListener('click', () => {
document.getElementById('detailModal').classList.remove('show');
});
window.addEventListener('click', (e) => {
const modal = document.getElementById('detailModal');
if (e.target === modal) {
modal.classList.remove('show');
}
});
document.getElementById('setAsCenterBtn').addEventListener('click', () => {
const modal = document.getElementById('detailModal');
const currentRepoName = modal.querySelector('.detail-section .detail-item:nth-child(2) .value').textContent;
selectRepo(currentRepoName);
modal.classList.remove('show');
});
const countSlider = document.getElementById('repoCount');
const countValue = document.getElementById('repoCountValue');
const applyBtn = document.getElementById('applyCountBtn');
countSlider.addEventListener('input', () => {
countValue.textContent = countSlider.value;
});
applyBtn.addEventListener('click', () => {
repoCount = parseInt(countSlider.value);
if (currentRepo) {
generateGraph();
}
});
}
function getThemeColor() {
const body = document.body;
if (body.classList.contains('dark-theme')) {
return {
textColor: '#ffffff',
textSecondary: '#a0a0a0',
tooltipBg: 'rgba(20, 20, 30, 0.95)',
tooltipBorder: 'rgba(100, 200, 255, 0.3)'
};
} else {
return {
textColor: '#333333',
textSecondary: '#64748b',
tooltipBg: 'rgba(20, 20, 30, 0.95)',
tooltipBorder: 'rgba(100, 149, 237, 0.3)'
};
}
}
function toggleTheme() {
const body = document.body;
const themeToggle = document.getElementById('themeToggle');
body.classList.toggle('dark-theme');
if (body.classList.contains('dark-theme')) {
themeToggle.innerHTML = '☀️';
} else {
themeToggle.innerHTML = '🌙';
}
if (currentRepo) {
selectRepo(currentRepo.basic_info.full_name);
}
generateLanguageLegend();
}
window.addEventListener('DOMContentLoaded', () => {
initEventListeners();
init();
generateLanguageLegend();
});
</script>
